[workspace]
resolver = "2"
members = [
    "crates/yorumi-core",
    "src-tauri",
]

[workspace.package]
version = "5.0.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1.0", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "cookies", "gzip", "brotli", "deflate"] }
scraper = "0.20"
url = "2.5"
regex = "1.10"
async-trait = "0.1"
thiserror = "2.0"
base64 = "0.22"
urlencoding = "2.1"
http = "1.1"
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
