name: Build Desktop Releases

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Tauri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Install macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build Tauri app (macOS universal)
        if: matrix.os == 'macos-latest'
        run: npm run build:tauri -- --target universal-apple-darwin
      - name: Build Tauri app
        if: matrix.os != 'macos-latest'
        run: npm run build:tauri
      - name: Normalize desktop download filename
        run: python scripts/normalize-tauri-artifact.py
      - uses: actions/upload-artifact@v4
        with:
          name: yorumi-desktop-${{ matrix.os }}
          path: |
            release-assets/desktop/*
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES_v5.0.6.md
          files: |
            release-assets/desktop/*
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
