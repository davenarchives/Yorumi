name: Build Desktop Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Desktop App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci
          cd ..

      - name: Build Web & Scraper Assets
        run: npm run build

      - name: Package Desktop App (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:electron:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Desktop App (macOS Universal)
        if: matrix.os == 'macos-latest'
        run: npm run build:electron:mac:universal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Desktop App (Windows Multi-Arch)
        if: matrix.os == 'windows-latest'
        run: npm run build:electron:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yorumi-desktop-${{ matrix.os }}
          path: |
            dist-app/*.exe
            dist-app/*.dmg
            dist-app/*.AppImage
            dist-app/*.zip
            dist-app/*.tar.gz
            dist-app/*.pkg
            dist-app/*.blockmap

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-app/*.exe
            dist-app/*.dmg
            dist-app/*.AppImage
            dist-app/*.zip
            dist-app/*.tar.gz
            dist-app/*.pkg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
