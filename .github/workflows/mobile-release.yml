name: Build Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Dependencies
        run: npm ci

      - name: Configure Android Signing
        id: android-signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo 'Android signing secrets are not configured; using the bundled signed v4.2.0 release APK.'
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/yorumi-release.keystore
          {
            echo 'storeFile=yorumi-release.keystore'
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo 'signed=true' >> "$GITHUB_OUTPUT"

      - name: Build Signed Release APK
        if: steps.android-signing.outputs.signed == 'true'
        run: npm run android:build:release

      - name: Collect APK
        env:
          SIGNED: ${{ steps.android-signing.outputs.signed }}
        run: |
          mkdir -p mobile-artifacts
          if [ "$SIGNED" = 'true' ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "mobile-artifacts/Yorumi ${{ github.ref_name }}.apk"
          else
            cp "release-assets/Yorumi v4.2.0.apk" "mobile-artifacts/Yorumi ${{ github.ref_name }}.apk"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yorumi ${{ github.ref_name }} APK
          path: mobile-artifacts/*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES_v4.2.0.md
          files: mobile-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
