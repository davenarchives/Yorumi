name: Build Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Dependencies
        run: npm ci

      - name: Configure Android Signing
        id: android-signing
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $required = @(
            $env:KEYSTORE_BASE64,
            $env:KEYSTORE_PASSWORD,
            $env:KEY_ALIAS,
            $env:KEY_PASSWORD
          )
          if ($required.Where({ [string]::IsNullOrWhiteSpace($_) }).Count -gt 0) {
            Write-Warning 'Android signing secrets are not configured; building an installable debug-signed APK.'
            'signed=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          $keystorePath = Join-Path $PWD 'android\app\yorumi-release.keystore'
          [IO.File]::WriteAllBytes($keystorePath, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          @(
            'storeFile=yorumi-release.keystore'
            "storePassword=$env:KEYSTORE_PASSWORD"
            "keyAlias=$env:KEY_ALIAS"
            "keyPassword=$env:KEY_PASSWORD"
          ) | Set-Content -Path 'android\key.properties' -Encoding ascii
          'signed=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Signed Release APK
        if: steps.android-signing.outputs.signed == 'true'
        run: npm run android:build:release

      - name: Build Installable APK Without Release Secrets
        if: steps.android-signing.outputs.signed != 'true'
        run: npm run android:build:debug

      - name: Collect APK
        shell: pwsh
        env:
          SIGNED: ${{ steps.android-signing.outputs.signed }}
        run: |
          New-Item -ItemType Directory -Force -Path mobile-artifacts | Out-Null
          $source = if ($env:SIGNED -eq 'true') {
            'android\app\build\outputs\apk\release\app-release.apk'
          } else {
            'android\app\build\outputs\apk\debug\app-debug.apk'
          }
          Copy-Item $source "mobile-artifacts\Yorumi ${{ github.ref_name }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yorumi ${{ github.ref_name }} APK
          path: mobile-artifacts/*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES_v4.2.0.md
          files: mobile-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
