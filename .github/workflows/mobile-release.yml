name: Build Android Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Dependencies
        run: npm ci

      - name: Configure Android Signing
        id: android-signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo 'Android signing secrets are not configured; using the bundled signed release APK.'
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/yorumi-release.keystore
          {
            echo 'storeFile=yorumi-release.keystore'
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo 'signed=true' >> "$GITHUB_OUTPUT"

      - name: Build Signed Release APK
        if: steps.android-signing.outputs.signed == 'true'
        run: npm run android:build:release

      - name: Validate Bundled Release APK
        if: steps.android-signing.outputs.signed != 'true'
        run: |
          expected_version="$(node -p "require('./package.json').version")"
          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          actual_version="$("$build_tools_dir/aapt" dump badging release-assets/Yorumi.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"

          "$build_tools_dir/apksigner" verify release-assets/Yorumi.apk

          if [ "$actual_version" != "$expected_version" ]; then
            echo "Bundled APK version $actual_version does not match package version $expected_version."
            echo 'Refusing to publish a stale Android release asset.'
            exit 1
          fi

      - name: Collect APK
        env:
          SIGNED: ${{ steps.android-signing.outputs.signed }}
        run: |
          mkdir -p mobile-artifacts
          if [ "$SIGNED" = 'true' ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "mobile-artifacts/Yorumi.apk"
          else
            cp "release-assets/Yorumi.apk" "mobile-artifacts/Yorumi.apk"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yorumi APK
          path: mobile-artifacts/*.apk

      - name: Remove Superseded APK Asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete-asset "${{ github.ref_name }}" 'Yorumi.apk' --yes || true

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES_v4.3.0.md
          files: mobile-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
