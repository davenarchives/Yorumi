name: Build Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Dependencies
        run: npm ci

      - name: Configure Android Signing
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $required = @(
            $env:KEYSTORE_BASE64,
            $env:KEYSTORE_PASSWORD,
            $env:KEY_ALIAS,
            $env:KEY_PASSWORD
          )
          if ($required.Where({ [string]::IsNullOrWhiteSpace($_) }).Count -gt 0) {
            throw 'ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD are required.'
          }
          $keystorePath = Join-Path $PWD 'android\app\yorumi-release.keystore'
          [IO.File]::WriteAllBytes($keystorePath, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          @(
            'storeFile=yorumi-release.keystore'
            "storePassword=$env:KEYSTORE_PASSWORD"
            "keyAlias=$env:KEY_ALIAS"
            "keyPassword=$env:KEY_PASSWORD"
          ) | Set-Content -Path 'android\key.properties' -Encoding ascii

      - name: Build Signed Release APK
        run: npm run android:build:release

      - name: Collect APK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path mobile-artifacts | Out-Null
          Copy-Item 'android\app\build\outputs\apk\release\app-release.apk' "mobile-artifacts\Yorumi-Android-${{ github.ref_name }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yorumi-android-${{ github.ref_name }}
          path: mobile-artifacts/*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES_v4.2.0.md
          files: mobile-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
